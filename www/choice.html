<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FSS-CAISSE — Configuration</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #0e0e0e;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .box {
    background: #1c1c1c;
    padding: 40px 44px;
    border-radius: 12px;
    width: 420px;
    text-align: center;
    border: 1px solid #2a2a2a;
  }
  h1 { color: #CC0000; font-size: 24px; margin: 0 0 4px; }
  p.sub { color: #999; font-size: 13px; margin: 0 0 26px; }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    background: #0e0e0e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 14px;
    cursor: pointer;
    color: #fff;
  }
  .choice:hover { border-color: #CC0000; background: #150000; }
  .choice .ic { font-size: 22px; margin-right: 8px; }
  .choice .ti { font-size: 15px; font-weight: bold; }
  .choice .de { font-size: 11px; color: #999; margin-top: 4px; }
</style>
</head>
<body>
<div class="box">
  <h1>FSS-CAISSE</h1>
  <p class="sub">Comment cet ordinateur doit-il être utilisé ?</p>

  <div class="choice" onclick="choose('server')">
    <span class="ic">🖥️</span><span class="ti">Ordinateur Serveur</span>
    <div class="de">Cet ordinateur centralise toutes les données (stock, ventes, clients). Un seul poste doit être choisi comme serveur.</div>
  </div>

  <div class="choice" onclick="choose('client')">
    <span class="ic">💻</span><span class="ti">Poste Client</span>
    <div class="de">Cet ordinateur se connecte à un serveur déjà installé sur le réseau.</div>
  </div>
</div>
<script>
  function choose(role) {
    window.electronAPI.chooseRole(role);
  }
</script>
</body>
</html>
