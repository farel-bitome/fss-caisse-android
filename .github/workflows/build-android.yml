name: Build Android (FSS-CAISSE TPE)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le NDK (requis par nodejs-mobile-cordova)
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Installer les dépendances npm
        run: npm install

      - name: Synchroniser le projet Capacitor Android
        # android/.gitignore (généré par Capacitor) exclut volontairement
        # capacitor-cordova-android-plugins/, assets/public/, capacitor.config.json et
        # capacitor.plugins.json — ce sont des fichiers dérivés, régénérés ici plutôt que
        # commités (comportement standard Capacitor). Sans cette étape, Gradle échoue en
        # cherchant capacitor-cordova-android-plugins/cordova.variables.gradle, absent du dépôt.
        run: npx cap sync android

      - name: Créer le dossier www attendu par nodejs-mobile-cordova
        # Le build.gradle de nodejs-mobile-cordova exige un dossier
        # src/main/assets/www/ à l'intérieur du module capacitor-cordova-android-plugins
        # (une convention Cordova classique que "cap sync" ne recrée pas). Il ne sert qu'à
        # cette vérification — le vrai contenu Node.js embarqué reste dans
        # android/app/src/main/assets/www/nodejs-project/, à l'endroit que lit NodeJS.java
        # au démarrage de l'appli.
        run: mkdir -p android/capacitor-cordova-android-plugins/src/main/assets/www

      - name: Copier les sources natives cdvnodejsmobile (app + module plugin)
        # "cap sync" copie bien android/capacitor-cordova-android-plugins/.../cdvnodejsmobile,
        # mais AUCUNE des deux copies (module plugin ni :app) ne reproduit fidèlement ce que
        # ferait un vrai "cordova prepare" : plugin.xml (ligne "libs/android/libnode/" →
        # "libs/cdvnodejsmobile/") attend que le dossier libnode/ soit copié AVEC son nom
        # (résultat : libs/cdvnodejsmobile/libnode/...), alors que la copie Capacitor aplatit
        # ce niveau. Et le hook Cordova qui décompresse les binaires libnode.so.gz en .so ne
        # tourne pas non plus sous Capacitor. On reconstruit donc la structure exacte
        # directement depuis node_modules, pour les DEUX modules qui compilent ce code natif
        # (:app et :capacitor-cordova-android-plugins), sans dépendre de ces deux mécanismes.
        run: |
          SRC=node_modules/nodejs-mobile-cordova
          rebuild() {
            DEST="$1"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            cp "$SRC/src/common/cordova-bridge/cordova-bridge.cpp" "$DEST/"
            cp "$SRC/src/common/cordova-bridge/cordova-bridge.h" "$DEST/"
            cp "$SRC/src/android/jni/native-lib.cpp" "$DEST/"
            cp "$SRC/src/android/CMakeLists.txt" "$DEST/"
            cp -r "$SRC/libs/android/libnode" "$DEST/libnode"
            for abi in armeabi-v7a arm64-v8a x86 x86_64; do
              gzip -df "$DEST/libnode/bin/$abi/libnode.so.gz"
            done
          }
          rebuild android/app/libs/cdvnodejsmobile
          rebuild android/capacitor-cordova-android-plugins/libs/cdvnodejsmobile
          find android/app/libs/cdvnodejsmobile -maxdepth 1
          ls -la android/app/libs/cdvnodejsmobile/libnode/bin/arm64-v8a/

      - name: Régénérer file.list / dir.list (nodejs-project)
        run: node scripts/generate-node-asset-lists.js

      - name: Copier les assets natifs du plugin (nodejs-mobile-cordova-assets)
        # Cause racine vérifiée du blocage silencieux du mode autonome : ce dossier
        # (modules Node intégrés au plugin) n'est normalement copié dans les assets Android que
        # par le hook Cordova "before_plugin_install", qui — comme celui de file.list/dir.list
        # ci-dessus — ne s'exécute PAS sous "npx cap sync android". Sans lui,
        # NodeJS.java (copyNodeJSAssets) plante avec une NullPointerException dès sa toute
        # première étape (assetManager.list() sur un dossier absent renvoie null, pas un tableau
        # vide), AVANT MÊME de copier nodejs-project — et comme cette exception n'est pas une
        # IOException, le sémaphore d'initialisation du plugin n'est jamais libéré : le
        # démarrage du serveur reste bloqué indéfiniment, sans le moindre message d'erreur.
        # Voir scripts/patch-nodejs-plugin-diagnostics.js pour le détail complet et un filet de
        # sécurité contre tout souci équivalent à l'avenir.
        run: |
          mkdir -p android/app/src/main/assets/nodejs-mobile-cordova-assets
          cp -r node_modules/nodejs-mobile-cordova/install/nodejs-mobile-cordova-assets/. \
                android/app/src/main/assets/nodejs-mobile-cordova-assets/
          find android/app/src/main/assets/nodejs-mobile-cordova-assets -maxdepth 1

      - name: Patcher NodeJS.java (robustesse + journal de diagnostic natif)
        # Corrige en plus, pour toute cause similaire non encore rencontrée, le fait qu'une
        # exception inattendue pendant la copie des assets pouvait bloquer waitForInit() pour
        # toujours (sémaphore jamais libéré) — et ajoute un journal natif consultable depuis
        # l'appli (FssNativeBridge.getNativePluginLog / android-bridge.js), sans adb.
        run: node scripts/patch-nodejs-plugin-diagnostics.js

      - name: Rendre gradlew exécutable
        # gradlew perd son bit d'exécution en passant par un système de fichiers Windows
        # (via un zip ou un commit depuis GitHub Desktop) — on le rétablit explicitement.
        run: chmod +x android/gradlew

      - name: Compiler l'APK debug (sideload)
        working-directory: android
        # FSS_VERSION_CODE = numéro d'exécution du workflow (github.run_number) : toujours
        # strictement croissant d'une publication à l'autre, jamais réutilisé, même en relançant
        # manuellement un ancien commit — condition nécessaire (avec le certificat de signature
        # stable, voir app/build.gradle et app/fss-debug.keystore) pour qu'une nouvelle APK
        # s'installe comme mise à jour PAR-DESSUS l'ancienne sur les TPE, en conservant toutes les
        # données, au lieu d'obliger à désinstaller l'ancienne version.
        env:
          FSS_VERSION_CODE: ${{ github.run_number }}
          FSS_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew assembleDebug --stacktrace --info > /tmp/gradle-debug.log 2>&1 || true

      - name: Extraire l'erreur de compilation (si échec)
        # Par défaut Gradle masque la sortie détaillée — --info la fait apparaître, mais noyée
        # dans des milliers de lignes. Un simple "tail -250" s'est révélé INSUFFISANT : avec
        # --stacktrace, Gradle imprime la trace COMPLÈTE (souvent 200+ lignes de classes internes
        # org.gradle.internal.*, sans aucun rapport avec la vraie cause) juste après le message
        # utile — les 250 dernières lignes ne contenaient donc plus que cette trace interne, sans
        # jamais remonter jusqu'à "* What went wrong:" ni "Caused by:".
        #
        # PIÈGE DÉCOUVERT ICI (celui qui a fait perdre du temps sur plusieurs allers-retours) :
        # pour une tâche comme :app:compileDebugJavaWithJavac, la VRAIE cause (les lignes
        # "MonFichier.java:123: error: ...") n'est PAS dans la section "* What went wrong:" —
        # cette section ne donne qu'un message générique ("Compilation failed; see the compiler
        # error output for details."). La sortie réelle du compilateur javac est imprimée PLUS
        # TÔT dans le log, comme sortie standard de la tâche elle-même, AVANT le rapport final
        # "FAILURE: Build failed...". On affiche donc maintenant D'ABORD ce bloc-là (recherché via
        # le marqueur ": error:" propre à javac), puis en complément la section "What went wrong".
        if: always()
        run: |
          if [ -s /tmp/gradle-debug.log ] && grep -q "BUILD FAILED" /tmp/gradle-debug.log; then
            echo "===== BUILD FAILED ====="
            if grep -q ": error:" /tmp/gradle-debug.log; then
              echo "----- Erreur(s) du compilateur javac -----"
              grep -n -B2 -A5 ": error:" /tmp/gradle-debug.log | head -300
              echo "----- fin des erreurs javac -----"
              echo ""
            fi
            if grep -q "What went wrong" /tmp/gradle-debug.log; then
              echo "----- Rapport Gradle (What went wrong) -----"
              awk '/What went wrong/{found=1} found' /tmp/gradle-debug.log | head -300
            else
              echo "(marqueur \"What went wrong\" introuvable — 250 dernières lignes en secours)"
              tail -250 /tmp/gradle-debug.log
            fi
            echo "===== fin de l'extrait ====="
            exit 1
          fi

      - name: Publier le log complet de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-log
          path: /tmp/gradle-debug.log

      - name: Compiler l'AAB release (Play Store)
        working-directory: android
        env:
          FSS_KEYSTORE_BASE64: ${{ secrets.FSS_KEYSTORE_BASE64 }}
          FSS_KEYSTORE_PASSWORD: ${{ secrets.FSS_KEYSTORE_PASSWORD }}
          FSS_KEY_ALIAS: ${{ secrets.FSS_KEY_ALIAS }}
          FSS_KEY_PASSWORD: ${{ secrets.FSS_KEY_PASSWORD }}
          FSS_VERSION_CODE: ${{ github.run_number }}
          FSS_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          if [ -n "$FSS_KEYSTORE_BASE64" ]; then
            echo "$FSS_KEYSTORE_BASE64" | base64 -d > app/fss-release.keystore
            ./gradlew bundleRelease --stacktrace
          else
            echo "Secrets de signature absents (FSS_KEYSTORE_BASE64...) — AAB release ignoré."
            echo "Voir README.md > 'Signer pour le Play Store' pour les créer."
          fi

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: fss-caisse-tpe-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publier l'AAB release (si signé)
        if: hashFiles('android/app/build/outputs/bundle/release/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fss-caisse-tpe-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
