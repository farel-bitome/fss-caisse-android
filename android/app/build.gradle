apply plugin: 'com.android.application'

android {
    namespace "com.fss.caisse"
    compileSdk rootProject.ext.compileSdkVersion
    // AGP 8+ désactive AIDL par défaut — nécessaire pour parler au service imprimante Sunmi
    // (android/app/src/main/aidl/woyou/aidlservice/jiuiv5/*.aidl).
    buildFeatures {
        aidl true
    }
    // Force l'EXTRACTION physique des bibliothèques natives (libnode.so etc.) sur le disque à
    // l'installation, plutôt que le chargement direct depuis le .apk compressé (comportement
    // par défaut d'AGP 8+ sur minSdk 23+). nodejs-mobile-cordova charge son moteur Node via
    // System.loadLibrary — ça fonctionne dans les deux cas sur un Android "standard", mais
    // plusieurs ROMs de terminaux de paiement (Sunmi, Senraise et autres caisses/tablettes
    // Android à firmware modifié) se sont montrées peu fiables avec le chargement direct
    // depuis l'APK, en particulier sur les gros binaires comme libnode.so. Coordonné avec
    // android:extractNativeLibs="true" dans AndroidManifest.xml (les deux réglages doivent
    // matcher, sinon AGP peut retomber sur son propre défaut).
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    defaultConfig {
        applicationId "com.fss.caisse"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // IMPORTANT — mise à jour en place sans perte de données (reçus, articles, tables,
        // clôtures... tout ce qui vit dans fss-data/ et les SharedPreferences) :
        // Android ne conserve les données de l'appli lors de l'installation d'une nouvelle APK
        // PAR-DESSUS l'ancienne que si DEUX conditions sont réunies à la fois :
        //   1) le même applicationId (ci-dessus, déjà stable : "com.fss.caisse") ;
        //   2) la nouvelle APK est signée avec EXACTEMENT le même certificat que celle déjà
        //      installée sur le TPE. Un certificat différent fait échouer l'installation
        //      ("conflicts with an existing package") et oblige à désinstaller l'ancienne
        //      version avant d'installer la nouvelle — ce qui efface tout.
        // Le numéro de version doit aussi être STRICTEMENT croissant à chaque publication, sinon
        // Android refuse de considérer l'APK comme une mise à jour. FSS_VERSION_CODE est fourni
        // automatiquement par le workflow GitHub Actions (numéro d'exécution, toujours
        // croissant) ; en local (Android Studio, build manuel...) on retombe sur 1.
        versionCode (System.getenv('FSS_VERSION_CODE') ? System.getenv('FSS_VERSION_CODE').toInteger() : 1)
        versionName (System.getenv('FSS_VERSION_NAME') ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signature de l'AAB/APK release, lue depuis des variables d'environnement (jamais commitée).
    // Voir README.md > "Signer pour le Play Store" pour générer le keystore et renseigner
    // les secrets GitHub Actions correspondants (FSS_KEYSTORE_BASE64, FSS_KEYSTORE_PASSWORD,
    // FSS_KEY_ALIAS, FSS_KEY_PASSWORD).
    def hasReleaseKeystore = file('fss-release.keystore').exists()
    signingConfigs {
        // Keystore de DEBUG stable et commité (voir fss-debug.keystore) : c'est LUI qui est
        // utilisé pour l'APK sideload (assembleDebug), celui que tu installes réellement sur les
        // TPE. Sans ceci, Gradle génère par défaut un certificat de debug ALÉATOIRE — et sur les
        // runners GitHub Actions (une machine neuve à chaque build, rien n'est conservé d'une
        // fois sur l'autre), ce certificat aléatoire change à CHAQUE compilation. Résultat : plus
        // aucune mise à jour ne pouvait s'installer par-dessus la précédente (certificats
        // différents à chaque fois) et il fallait désinstaller à chaque fois, ce qui effaçait
        // toutes les données. En committant ce keystore et en le réutilisant explicitement ici,
        // toutes les APK de debug publiées à partir de maintenant partagent le même certificat,
        // et s'installent donc les unes par-dessus les autres en conservant les données.
        debug {
            storeFile file('fss-debug.keystore')
            storePassword 'fss-caisse-debug'
            keyAlias 'fss-caisse-debug'
            keyPassword 'fss-caisse-debug'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file('fss-release.keystore')
                storePassword System.getenv('FSS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FSS_KEY_ALIAS')
                keyPassword System.getenv('FSS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Sans ceci, Gradle nomme systématiquement le fichier produit "app-debug.apk" — un nom
    // générique impossible à distinguer une fois téléchargé depuis les artefacts GitHub Actions
    // (surtout avec plusieurs logiciels TPE en parallèle, ex. FSS-CALCUL). On renomme donc le
    // fichier APK lui-même avec le nom du logiciel tout court, indépendamment du nom affiché sur
    // l'appareil (déjà correct, voir android:label="@string/app_name" dans AndroidManifest.xml).
    // NOTE : ceci ne couvre que l'APK — le nom du fichier .aab (Play Store) est renommé
    // séparément après coup dans le workflow GitHub Actions, car l'API
    // applicationVariants.outputs ne s'applique qu'aux variantes qui produisent un APK.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "FSS-CAISSE-TPE.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
